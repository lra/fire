[package]
name = "fire"
version = "0.4.0"
edition = "2024"

# rlib for the native bin, cdylib for the wasm build (see web/).
[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.28"

# The per-output-pixel upscale/bloom path needs optimizations even for
# plain `cargo run` to hold 60 fps.
[profile.dev]
opt-level = 2
